{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkNova | Smart Parking Finder System</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="{%static 'css/nav2-style.css' %}">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

<nav class="navbar">
    <div class="logo">ParkNova</div>

    <ul class="nav-links">
        <li><a href="{% url 'mydashboard' %}">Dashboard</a></li>
        <li><a href="{% url 'find_parking' %}">Find Parking</a></li>
        <li><a href="{% url 'my_bookings' %}">My Bookings</a></li>
    </ul>

    <div class="profile-menu">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="profile-icon">

        <div class="dropdown">
            <a href="{% url 'my_profile' %}">My Profile</a>
            <a href="{% url 'logout' %}">Logout</a>
        </div>
    </div>
</nav>


<script>
function sendLocation() {

    if (navigator.geolocation) {

        navigator.geolocation.getCurrentPosition(function(position) {

            fetch("/save-location/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": "{{ csrf_token }}"
                },
                body: JSON.stringify({
                    lat: position.coords.latitude,
                    lng: position.coords.longitude
                })
            });

        });

    }
}

// run once
sendLocation();

// live tracking
setInterval(sendLocation, 30000);
</script>

</body>

</html>
