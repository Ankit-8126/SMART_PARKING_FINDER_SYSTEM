{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Book Parking</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #f5f7fb);
        }

        /* NAV SPACING FIX */
        .page-wrapper {
            padding-top: 80px;
            padding-bottom: 60px;
        }

        /* CENTER CARD */
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* PREMIUM CARD */
        .card {
            background: white;
            width: 380px;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.12);
            transition: 0.3s ease;
            animation: fadeIn 0.6s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h2 {
            text-align: center;
            color: #0d47a1;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* INPUT STYLE */
        label {
            font-size: 14px;
            font-weight: 500;
            color: #444;
        }

        input[type="number"] {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            margin-bottom: 18px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }

        input[type="number"]:focus {
            border-color: #1976d2;
            box-shadow: 0 0 8px rgba(25,118,210,0.2);
        }

        /* BUTTON */
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1976d2, #0d47a1);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 20px rgba(25,118,210,0.3);
        }

        /* ERROR */
        .error {
            color: #e53935;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
        }

        /* INFO CARD */
        .info {
            background: #f1f6ff;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 18px;
            font-size: 13px;
            color: #333;
        }

        .price {
            color: #2e7d32;
            font-weight: 600;
        }

    </style>
</head>

<body>

{% include 'nav2.html' %}

<div class="page-wrapper">

    <div class="container">

        <div class="card">

            <h2>🚗 Book Parking Slot</h2>

            <!-- INFO BOX -->
            <div class="info">
                📍 <b>{{ parking.name }}</b><br>
                🏠 {{ parking.address }}<br>
                💰 <span class="price">₹{{ parking.price }} / hour</span><br>
                🅿 Available Slots: {{ parking.available_slots }}
            </div>

            <!-- FORM -->
            <form method="POST">
                {% csrf_token %}

                <label>Enter Hours</label>
                <input type="number" name="hours" min="1" placeholder="e.g. 2" required>

                <button type="submit">Proceed to Payment 🚀</button>
            </form>

            {% if error %}
                <p class="error">{{ error }}</p>
            {% endif %}

        </div>

    </div>

</div>

{% include 'footer.html' %}

</body>
</html>
